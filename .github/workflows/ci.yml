name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[events]"
          # Pin ruff + mypy: both are unpinned formatters/type-checkers whose
          # output changes between releases. An unpinned `ruff format --check`
          # went red the day ruff 0.16.0 shipped (it reformats code that is
          # clean under the version the repo was formatted with). Pin to the
          # versions the codebase is known-good against; bump deliberately.
          pip install pytest pytest-asyncio ruff==0.15.20 mypy==2.1.0

      - name: Banned-token guard (rebrand mangle)
        # The anima.email -> useanima.sh rebrand find-replace once mangled the
        # code identifier `anima.emails.*` into a nonsense token. This gate
        # keeps that token (and anything like it) from ever shipping again.
        # Pattern uses [.] so this workflow file does not match itself.
        run: |
          if git grep -In "useanima[.]shs"; then
            echo "::error::Banned rebrand-mangle token found (\"useanima\" + \".shs\"). Restore the original identifier."
            exit 1
          fi
          echo "Clean: no rebrand-mangle tokens."

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy src/

      - name: Run tests
        run: pytest

      - name: Build
        run: |
          pip install build
          python -m build
